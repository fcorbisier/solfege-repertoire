<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Répertoire de solfège</title>
<meta name="theme-color" content="#243b6b">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Solfège">

<style>
:root {
  --bg: #faf8f3; --card: #ffffff; --ink: #1d2433; --muted: #6a7285; --line: #e3dfd4;
  --accent: #243b6b; --accent-ink: #ffffff; --soft: #e8edf7; --playing: #fff2d6;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12151c; --card: #1b2030; --ink: #e9ecf4; --muted: #98a1b6; --line: #2a3145;
    --accent: #8fb0ff; --accent-ink: #12151c; --soft: #232b42; --playing: #3a3220;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  padding-bottom: calc(150px + env(safe-area-inset-bottom));
}
header {
  position: sticky; top: 0; z-index: 5; background: var(--bg);
  border-bottom: 1px solid var(--line);
  padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
}
.bar { max-width: 760px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
h1 { font: 700 1.35rem/1.2 Georgia, "Times New Roman", serif; margin: 0; flex: 1 1 auto; }
input[type=search] {
  flex: 1 1 100%; font: inherit; color: inherit; background: var(--card);
  border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px;
}
button { font: inherit; color: inherit; cursor: pointer; }
.btn {
  background: var(--soft); border: 1px solid var(--line); border-radius: 10px;
  padding: 7px 12px; font-size: .88rem;
}
.btn[disabled] { opacity: .6; cursor: default; }
main { max-width: 760px; margin: 0 auto; padding: 8px 16px 16px; }
section h2 {
  font: 700 .85rem/1 system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase;
  color: var(--muted); margin: 26px 2px 10px;
}
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 12px 14px 6px; margin-bottom: 12px;
}
.card h3 { font: 700 1.1rem/1.2 Georgia, serif; margin: 0 0 6px; }
ul { list-style: none; margin: 0; padding: 0; }
.track {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
  background: none; border: 0; border-top: 1px solid var(--line); padding: 11px 2px; min-height: 48px;
}
.track:first-child { border-top: 0; }
.track .ico {
  flex: none; width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center;
}
.track .ico svg { width: 14px; height: 14px; fill: currentColor; }
.track .lbl { flex: 1; min-width: 0; }
.chip {
  font-size: .72rem; border-radius: 99px; padding: 2px 8px; background: var(--soft); color: var(--muted);
  margin-left: 6px; white-space: nowrap; vertical-align: 1px;
}
.track .dur { color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; }
.track.on { background: var(--playing); border-radius: 8px; }
.track.cached .dur::after { content: " ✓"; }
.empty { color: var(--muted); text-align: center; padding: 40px 0; }

#player {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--card);
  border-top: 1px solid var(--line); box-shadow: 0 -4px 18px rgba(0,0,0,.08);
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
}
.pl { max-width: 760px; margin: 0 auto; }
.np { display: flex; justify-content: space-between; gap: 10px; font-size: .9rem; margin-bottom: 4px; }
.np b { font-family: Georgia, serif; }
.np span { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seek { display: flex; align-items: center; gap: 8px; font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
input[type=range] { flex: 1; accent-color: var(--accent); height: 28px; }
.ctrl { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: 2px; flex-wrap: wrap; }
.ctrl .main { display: flex; gap: 6px; align-items: center; }
.ib {
  width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--soft);
  display: grid; place-items: center;
}
.ib svg { width: 18px; height: 18px; fill: currentColor; }
.ib.big { width: 52px; height: 52px; background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.opts { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.opts .btn { padding: 6px 10px; }
.opts .btn[aria-pressed=true] { background: var(--accent); color: var(--accent-ink); }
select.btn { appearance: auto; }
.modes { display: flex; gap: 6px; margin: 6px 0 2px; }
.modes[hidden] { display: none; }
.modes .btn { flex: 1; padding: 6px 10px; }
.modes .btn[aria-pressed=true] { background: var(--accent); color: var(--accent-ink); }
.mix { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 10px; align-items: center; margin: 6px 0 2px; font-size: .85rem; }
.mix label { color: var(--muted); }
.mix output { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 3.2em; text-align: right; }
.mix[hidden] { display: none; }
#ab { font-size: .75rem; color: var(--muted); min-width: 4.5em; text-align: right; }

.beat { margin: 8px 0 2px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--soft); }
.beat[hidden] { display: none; }
.bt-top { display: flex; align-items: center; gap: 10px; }
.bt-top svg { width: 84px; height: 84px; flex: none; }
.bt-mid { flex: 1; min-width: 0; }
.dots { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; min-height: 26px; }
.dots i { width: 16px; height: 16px; border-radius: 50%; background: var(--line); transition: background .08s, transform .08s; }
.dots i.main { width: 22px; height: 22px; }
.dots i.on { background: var(--accent); transform: scale(1.25); }
.dots i.on.first { background: #d9822b; }
.bt-info { font-size: .8rem; color: var(--muted); margin-top: 4px; }
.bt-set { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px 10px; margin-top: 8px; font-size: .8rem; }
.bt-set[hidden] { display: none; }
.bt-set label { display: flex; flex-direction: column; gap: 2px; color: var(--muted); }
.bt-set input { font: inherit; padding: 4px 6px; width: 100%; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); }
.bt-set .wide { grid-column: 1 / -1; }
.bt-btns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.bt-btns .btn { padding: 6px 10px; }
#tap { flex: 1; font-weight: 600; }
#tap.rec { background: #d9822b; color: #fff; }
#bt-json { font: .72rem/1.3 ui-monospace, monospace; color: var(--muted); user-select: all; }
.bt-line { stroke: var(--muted); opacity: .35; fill: none; stroke-width: 2; stroke-linejoin: round; }
.bt-ball { fill: var(--accent); }
.bt-ball.hit { fill: #d9822b; }
@media (max-width: 420px) { .ctrl { justify-content: center; } .opts { justify-content: center; } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>Répertoire de solfège</h1>
    <button class="btn" id="offline" type="button">Télécharger pour hors ligne</button>
    <input type="search" id="q" placeholder="Rechercher (3b, accompagnement, sol mineur…)" aria-label="Rechercher">
  </div>
</header>
<main id="list" aria-live="polite"></main>

<div id="player" hidden>
  <div class="pl">
    <div class="np"><b id="npt">—</b><span id="nps"></span></div>
    <div class="seek">
      <span id="cur">0:00</span>
      <input type="range" id="seek" min="0" max="1" step="0.1" value="0" aria-label="Position">
      <span id="tot">0:00</span>
    </div>
    <div class="beat" id="beat" hidden>
      <div class="bt-top">
        <svg viewBox="0 0 100 100" aria-hidden="true"><path class="bt-line" id="btPath" d=""/><circle class="bt-ball" id="btBall" r="7" cx="50" cy="85"/></svg>
        <div class="bt-mid">
          <div class="dots" id="dots" aria-hidden="true"></div>
          <div class="bt-info" id="btInfo"></div>
        </div>
        <button class="btn" id="btCfg" type="button" aria-expanded="false">Tempo</button>
      </div>
      <div class="bt-set" id="btSet" hidden>
        <label>Tempo (battue/min)<input type="number" id="btBpm" min="20" max="240" step="0.1" inputmode="decimal"></label>
        <label>1er temps fort (s)<input type="number" id="btDeb" min="0" step="0.01" inputmode="decimal"></label>
        <label>Mesures de silence<input type="number" id="btSil" min="0" max="8" step="1" inputmode="numeric"></label>
        <div class="bt-btns wide">
          <button class="btn" id="tap" type="button">Taper le tempo : lance l'audio, tape chaque temps (1er tap = temps fort)</button>
          <button class="btn" id="btReset" type="button">Effacer</button>
        </div>
        <div class="wide bt-info">Décalage audio (Bluetooth) <input type="range" id="btLat" min="-300" max="300" step="10" value="0" style="width:60%;vertical-align:middle"> <output id="btLato">0 ms</output></div>
        <div class="wide" id="bt-json"></div>
      </div>
    </div>
    <div class="modes" id="modes" role="group" aria-label="Version de l'enregistrement">
      <button class="btn" type="button" id="mOrig" aria-pressed="false">Original</button>
      <button class="btn" type="button" id="mSplit" aria-pressed="true">Piano + voix (réglable)</button>
    </div>
    <div class="mix" id="mix">
      <label for="vp">Piano</label><input type="range" id="vp" min="0" max="150" step="5" value="100" aria-label="Volume du piano"><output id="vpo">100 %</output>
      <label for="vv">Voix</label><input type="range" id="vv" min="0" max="150" step="5" value="40" aria-label="Volume de la voix"><output id="vvo">40 %</output>
    </div>
    <div class="ctrl">
      <div class="main">
        <button class="ib" id="prev" type="button" aria-label="Piste précédente"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
        <button class="ib big" id="pp" type="button" aria-label="Lecture / pause"></button>
        <button class="ib" id="next" type="button" aria-label="Piste suivante"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5l11 7L4 19z"/></svg></button>
      </div>
      <div class="opts">
        <select id="rate" class="btn" aria-label="Vitesse">
          <option value="0.5">×0,5</option><option value="0.6">×0,6</option><option value="0.75">×0,75</option>
          <option value="0.9">×0,9</option><option value="1" selected>×1</option><option value="1.25">×1,25</option>
        </select>
        <button class="btn" id="loop" type="button" aria-pressed="false">Boucle</button>
        <button class="btn" id="abbtn" type="button">A–B</button>
        <span id="ab"></span>
      </div>
    </div>
  </div>
  <audio id="audio" preload="metadata"></audio>
  <audio id="voice" preload="metadata"></audio>
</div>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const PLAY = '<svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>';
  const PAUSE = '<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';
  const CACHE = 'audio-v2';
  const fmt = (s) => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  const store = {
    get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };

  const audio = $('#audio');
  const voice = $('#voice');
  let loopOn = false;
  let mode = 'split';   // 'split' = piano + voix, 'original' = fichier d'origine
  let data, tracks = [], cur = -1, a = null, b = null, dragging = false;
  const cachedSet = new Set();
  const files = (t) => [t.piano, t.voix, t.original].filter(Boolean);
  const missing = new Set();   // fichiers introuvables : ignorés pour le hors ligne
  const isCached = (t) => files(t).every((f) => cachedSet.has(f) || missing.has(f));

  // le lecteur est fixe en bas : on réserve sa hauteur réelle pour que la fin de la liste reste visible
  const fitPlayer = () => { const p = $('#player'); document.body.style.paddingBottom = p.hidden ? '' : (p.offsetHeight + 24) + 'px'; };
  new ResizeObserver(fitPlayer).observe($('#player'));

  async function init() {
    try {
      const r = await fetch('morceaux.json', { cache: 'no-cache' });
      data = await r.json();
    } catch {
      $('#list').innerHTML = '<p class="empty">Impossible de charger la liste des morceaux.</p>';
      return;
    }
    await refreshCached();
    render();
    mode = store.get('mode', 'split') === 'original' ? 'original' : 'split';
    $('#mOrig').setAttribute('aria-pressed', mode === 'original');
    $('#mSplit').setAttribute('aria-pressed', mode !== 'original');
    const rate = store.get('rate', '1');
    $('#rate').value = rate; audio.playbackRate = parseFloat(rate);
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  async function refreshCached() {
    cachedSet.clear();
    if (!('caches' in window)) return;
    try {
      const c = await caches.open(CACHE);
      const base = new URL('./', location.href).pathname;   // dossier de la page (ex. /solfege-repertoire/)
      for (const req of await c.keys()) { const pn = new URL(req.url).pathname; cachedSet.add(pn.startsWith(base) ? pn.slice(base.length) : pn); }
    } catch {}
    updateOfflineBtn();
  }

  function updateOfflineBtn() {
    const btn = $('#offline');
    if (!('caches' in window) || !tracks.length) { if (!('caches' in window)) btn.hidden = true; return; }
    const n = tracks.filter(isCached).length;
    btn.textContent = n === tracks.length ? 'Disponible hors ligne ✓' : `Télécharger pour hors ligne (${n}/${tracks.length})`;
    btn.disabled = n === tracks.length;
  }

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function addTrack(ul, t, chipText) {
    const li = el('li');
    const btn = el('button', 'track'); btn.type = 'button'; btn.dataset.i = t.idx;
    if (isCached(t)) btn.classList.add('cached');
    const ico = el('span', 'ico'); ico.innerHTML = PLAY;
    const lbl = el('span', 'lbl', t.label);
    if (chipText) lbl.append(el('span', 'chip', chipText));
    btn.append(ico, lbl, el('span', 'dur', fmt(t.duree)));
    li.append(btn); ul.append(li);
  }

  function render() {
    const root = $('#list'); root.innerHTML = ''; tracks = [];
    const q = $('#q').value.trim().toLowerCase();
    const chips = { variante: 'variante' };

    // indexation globale (ordre d'affichage complet, indépendant du filtre)
    let idx = 0;
    const lecons = new Map();
    for (const m of data.morceaux) {
      for (const p of m.pistes) { p.idx = idx++; p.exo = m.titre; p.mesure = p.mesure || m.mesure; if (p.silence == null && m.silence) p.silence = m.silence; tracks.push(p); }
      if (!lecons.has(m.lecon)) lecons.set(m.lecon, []);
      lecons.get(m.lecon).push(m);
    }
    for (const p of data.autres.pistes) { p.idx = idx++; p.exo = data.autres.titre; tracks.push(p); }

    const match = (text) => !q || text.toLowerCase().includes(q);
    let shown = 0;
    for (const [lecon, exos] of lecons) {
      const sec = el('section'); sec.append(el('h2', null, `Leçon ${lecon}`));
      let any = false;
      for (const m of exos) {
        const ps = m.pistes.filter((p) => match(`${m.id} ${m.titre} ${p.label} ${p.role}`));
        if (!ps.length) continue;
        any = true;
        const card = el('article', 'card'); card.append(el('h3', null, m.titre));
        const ul = el('ul');
        for (const p of ps) addTrack(ul, p, p.role === 'lecture' ? '' : chips[p.role]);
        card.append(ul); sec.append(card);
      }
      if (any) { root.append(sec); shown++; }
    }
    const ps = data.autres.pistes.filter((p) => match(`${data.autres.titre} ${p.label}`));
    if (ps.length) {
      const sec = el('section'); sec.append(el('h2', null, data.autres.titre));
      const card = el('article', 'card'); const ul = el('ul');
      for (const p of ps) addTrack(ul, p, '');
      card.append(ul); sec.append(card); root.append(sec); shown++;
    }
    if (!shown) root.append(el('p', 'empty', 'Aucun résultat.'));
    highlight(); updateOfflineBtn();
  }

  function highlight() {
    document.querySelectorAll('.track').forEach((b) => b.classList.toggle('on', +b.dataset.i === cur));
  }

  function load(i, autoplay = true) {
    const t = tracks[i]; if (!t) return;
    cur = i; a = b = null; updateAB();
    setSources(t);
    loadBeat(t);
    $('#player').hidden = false; fitPlayer();
    $('#npt').textContent = t.exo; $('#nps').textContent = t.label;
    $('#seek').value = 0; $('#cur').textContent = '0:00'; $('#tot').textContent = fmt(t.duree);
    if ('mediaSession' in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({ title: `${t.exo} — ${t.label}`, artist: 'Solfège' });
    }
    if (autoplay) playBoth();
    highlight();
  }

  const useOriginal = (t) => mode === 'original' && !!t.original;
  const hasVoice = () => { const t = tracks[cur]; return !!(t && t.voix && !useOriginal(t)); };
  function setSources(t) {
    voice.pause();
    audio.src = useOriginal(t) ? t.original : t.piano;
    audio.playbackRate = parseFloat($('#rate').value);
    if (t.voix && !useOriginal(t)) { voice.src = t.voix; voice.playbackRate = audio.playbackRate; }
    else { voice.removeAttribute('src'); voice.load(); }
    $('#modes').hidden = !t.voix;           // pas de choix si l'enregistrement n'a pas de voix séparée
    $('#mix').hidden = !t.voix || useOriginal(t);
    $('#mOrig').setAttribute('aria-pressed', useOriginal(t) && !!t.voix);
    $('#mSplit').setAttribute('aria-pressed', !(useOriginal(t) && !!t.voix));
  }
  function setMode(m) {
    if (mode === m) return;
    mode = m; store.set('mode', m);
    if (cur < 0) { $('#mOrig').setAttribute('aria-pressed', m === 'original'); $('#mSplit').setAttribute('aria-pressed', m !== 'original'); return; }
    const t = tracks[cur], at = audio.currentTime, wasPlaying = !audio.paused;
    setSources(t);
    audio.addEventListener('loadedmetadata', function once() {
      audio.removeEventListener('loadedmetadata', once);
      audio.currentTime = at;
      if (wasPlaying) playBoth();
    });
  }
  $('#mOrig').addEventListener('click', () => setMode('original'));
  $('#mSplit').addEventListener('click', () => setMode('split'));
  // si l'original est introuvable, on revient aux pistes séparées
  audio.addEventListener('error', () => {
    const t = tracks[cur];
    if (t && useOriginal(t)) { missing.add(t.original); t.original = null; mode = 'split'; setSources(t); playBoth(); }
  });

  function step(d) { const n = cur + d; if (n >= 0 && n < tracks.length) load(n); }

  function updateAB() {
    $('#ab').textContent = a == null ? '' : b == null ? `A ${fmt(a)}` : `${fmt(a)}→${fmt(b)}`;
    $('#abbtn').setAttribute('aria-pressed', a != null ? 'true' : 'false');
    $('#abbtn').style.outline = a != null ? '2px solid var(--accent)' : '';
  }

  // --- événements ---
  $('#list').addEventListener('click', (e) => {
    const btn = e.target.closest('.track'); if (!btn) return;
    const i = +btn.dataset.i;
    if (i === cur) toggle(); else load(i);
  });
  $('#q').addEventListener('input', render);
  $('#pp').addEventListener('click', () => { if (cur < 0) return; toggle(); });
  $('#prev').addEventListener('click', () => { if (audio.currentTime > 3) seekTo(0); else step(-1); });
  $('#next').addEventListener('click', () => step(1));
  $('#rate').addEventListener('change', (e) => { audio.playbackRate = voice.playbackRate = parseFloat(e.target.value); store.set('rate', e.target.value); });
  $('#loop').addEventListener('click', (e) => {
    const on = e.currentTarget.getAttribute('aria-pressed') !== 'true';
    e.currentTarget.setAttribute('aria-pressed', on); loopOn = on;
  });
  $('#abbtn').addEventListener('click', () => {
    if (a == null) a = audio.currentTime;
    else if (b == null) { b = audio.currentTime; if (b <= a + 0.2) { a = b = null; } else { seekTo(a); } }
    else { a = b = null; }
    updateAB();
  });

  const seek = $('#seek');
  seek.addEventListener('input', () => { dragging = true; $('#cur').textContent = fmt(seek.value); });
  seek.addEventListener('change', () => { seekTo(parseFloat(seek.value)); dragging = false; });

  audio.addEventListener('loadedmetadata', () => { seek.max = audio.duration; $('#tot').textContent = fmt(audio.duration); });
  audio.addEventListener('seeked', () => drawBeat());
  audio.addEventListener('play', () => { $('#pp').innerHTML = PAUSE; tick(); });
  audio.addEventListener('pause', () => { $('#pp').innerHTML = PLAY; voice.pause(); });
  audio.addEventListener('ended', () => {
    if (loopOn) { seekTo(0); playBoth(); return; }
    $('#pp').innerHTML = PLAY; voice.pause();
  });
  audio.addEventListener('timeupdate', () => {
    if (!dragging) { seek.value = audio.currentTime; $('#cur').textContent = fmt(audio.currentTime); }
    resync();
  });
  // la voix suit le piano (piste maîtresse) : recale si l'écart dépasse 60 ms
  function resync() {
    if (hasVoice() && !audio.paused && Math.abs(voice.currentTime - audio.currentTime) > 0.06) voice.currentTime = audio.currentTime;
  }
  // boucle A–B précise (timeupdate est trop lent pour ça)
  function tick() {
    if (b != null && audio.currentTime >= b) seekTo(a); else resync();
    drawBeat();
    if (!audio.paused) requestAnimationFrame(tick);
  }


  // --- pulsation + battue de mesure ---
  // Tempo = battue (noire en 2/4, 3/4, 4/4 ; noire pointée en 6/8). Les temps sont calculés depuis audio.currentTime :
  // l'animation suit donc la vitesse, les sauts, les boucles A–B.
  const PATTERNS = {
    2: [[50, 86], [50, 30]],
    3: [[38, 86], [78, 55], [50, 24]],
    4: [[50, 86], [22, 58], [78, 58], [50, 22]],
  };
  const beatCfg = { n: 2, sub: 1, bpm: 0, deb: 0, sil: 0, lat: 0 };
  let tapping = false, taps = [];
  const bkey = (t) => 'beat:' + (t.piano || t.original);
  function loadBeat(t) {
    const m = /^(\d+)\/(\d+)$/.exec(t.mesure || '');
    beatCfg.n = 0;
    if (m) { const num = +m[1], den = +m[2]; beatCfg.n = den === 8 ? num / 3 : num; beatCfg.sub = den === 8 ? 3 : 1; }
    let o = {}; try { o = JSON.parse(store.get(bkey(t), '{}')) || {}; } catch {}
    beatCfg.bpm = +(o.bpm ?? t.bpm ?? 0);
    beatCfg.deb = +(o.debut ?? t.debut ?? 0);
    beatCfg.sil = +(o.silence ?? t.silence ?? 0);
    beatCfg.lat = +store.get('beat-lat', '0') / 1000;
    tapping = false; taps = []; $('#tap').classList.remove('rec');
    $('#beat').hidden = !beatCfg.n;
    if (!beatCfg.n) return;
    const pts = PATTERNS[beatCfg.n];
    $('#btPath').setAttribute('d', 'M' + pts.map((p) => p.join(',')).join('L') + 'L' + pts[0].join(','));
    const dots = $('#dots'); dots.innerHTML = '';
    const total = beatCfg.n * beatCfg.sub;
    for (let i = 0; i < total; i++) {
      const d = document.createElement('i');
      if (i % beatCfg.sub === 0) d.className = 'main' + (i === 0 ? ' first' : '');
      dots.append(d);
    }
    $('#btBpm').value = beatCfg.bpm || ''; $('#btDeb').value = beatCfg.deb || ''; $('#btSil').value = beatCfg.sil;
    $('#btLat').value = beatCfg.lat * 1000; $('#btLato').textContent = Math.round(beatCfg.lat * 1000) + ' ms';
    showBeatJson(t);
    drawBeat(true);
  }
  function showBeatJson(t) {
    $('#bt-json').textContent = beatCfg.bpm ? `"bpm": ${beatCfg.bpm}, "debut": ${beatCfg.deb}` + (beatCfg.sil ? `, "silence": ${beatCfg.sil}` : '') : '';
  }
  function saveBeat() {
    const t = tracks[cur]; if (!t) return;
    store.set(bkey(t), JSON.stringify({ bpm: beatCfg.bpm, debut: beatCfg.deb, silence: beatCfg.sil }));
    showBeatJson(t);
  }
  const lastDots = { k: -1 };
  function drawBeat(force) {
    if (!beatCfg.n || $('#beat').hidden) return;
    const info = $('#btInfo'), ball = $('#btBall');
    if (!beatCfg.bpm) { info.textContent = `${tracks[cur].mesure} — règle le tempo (bouton « Tempo »)`; return; }
    const per = 60 / beatCfg.bpm;
    const t = audio.currentTime - beatCfg.lat;
    // origine = début de la 1re mesure (éventuellement silencieuse)
    const origin = beatCfg.deb - beatCfg.sil * beatCfg.n * per;
    const x = (t - origin) / per;                    // position en temps (battue)
    if (x < 0) { setDots(-1); ball.setAttribute('cx', PATTERNS[beatCfg.n][0][0]); ball.setAttribute('cy', PATTERNS[beatCfg.n][0][1]); info.textContent = `${tracks[cur].mesure} · ${Math.round(beatCfg.bpm)}/min`; return; }
    const k = Math.floor(x), f = x - k;
    const bar = Math.floor(k / beatCfg.n), bt = k % beatCfg.n;
    const pts = PATTERNS[beatCfg.n], p0 = pts[bt], p1 = pts[(bt + 1) % beatCfg.n];
    // la balle atteint chaque point (ictus) exactement sur le temps : accélère vers lui, rebondit après
    const e = f * f;
    let px = p0[0] + (p1[0] - p0[0]) * e, py = p0[1] + (p1[1] - p0[1]) * e;
    ball.setAttribute('cx', px.toFixed(1)); ball.setAttribute('cy', py.toFixed(1));
    ball.classList.toggle('hit', f < 0.12);
    const sub = beatCfg.sub > 1 ? Math.floor(f * beatCfg.sub) : 0;
    setDots(bt * beatCfg.sub + sub);
    const num = bar - beatCfg.sil + 1;
    info.textContent = `${tracks[cur].mesure} · ${Math.round(beatCfg.bpm)}/min · ` + (num >= 1 ? `mesure ${num}` : 'mesure à vide');
  }
  function setDots(i) {
    if (lastDots.k === i) return; lastDots.k = i;
    $('#dots').childNodes.forEach((d, j) => d.classList.toggle('on', j === i && (beatCfg.sub === 1 || true)));
  }
  $('#btCfg').addEventListener('click', () => {
    const open = $('#btSet').hidden; $('#btSet').hidden = !open; $('#btCfg').setAttribute('aria-expanded', open); fitPlayer();
  });
  for (const [id, key] of [['#btBpm', 'bpm'], ['#btDeb', 'deb'], ['#btSil', 'sil']]) {
    $(id).addEventListener('input', () => { beatCfg[key] = parseFloat($(id).value) || 0; saveBeat(); drawBeat(true); });
  }
  $('#btLat').addEventListener('input', (e) => { beatCfg.lat = e.target.value / 1000; $('#btLato').textContent = e.target.value + ' ms'; store.set('beat-lat', e.target.value); });
  $('#btReset').addEventListener('click', () => {
    const t = tracks[cur]; if (!t) return;
    try { localStorage.removeItem(bkey(t)); } catch {}
    loadBeat(t);
  });
  // Tap : 1er tap = temps fort de la 1re mesure sonore, puis un tap par temps (battue). Ajustement par régression.
  $('#tap').addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (audio.paused) { playBoth(); return; }
    if (!tapping) { tapping = true; taps = []; $('#tap').classList.add('rec'); }
    taps.push(audio.currentTime - beatCfg.lat);
    $('#tap').textContent = `${taps.length} tap${taps.length > 1 ? 's' : ''} — continue ; arrête-toi 2 s pour valider (≥ 6)`;
    if (taps.length >= 8 || false) { /* assez : l'utilisateur peut continuer */ }
  });
  $('#tap').addEventListener('click', (e) => {
    // clic clavier/souris sans pointer : ignoré ; la validation se fait via double-pression longue ci-dessous
  });
  function finishTap() {
    if (taps.length < 4) { tapping = false; taps = []; $('#tap').classList.remove('rec'); $('#tap').textContent = 'Taper le tempo : lance l\'audio, tape chaque temps (1er tap = temps fort)'; return; }
    const n = taps.length; let sx = 0, sy = 0, sxx = 0, sxy = 0;
    // écarte les doubles taps (< 40 % du pas médian)
    const d = taps.slice(1).map((v, i) => v - taps[i]).sort((x, y) => x - y); const med = d[d.length >> 1];
    const clean = taps.filter((v, i) => i === 0 || v - taps[i - 1] > med * 0.4);
    const m = clean.length;
    // index entier le plus proche pour chaque tap (tolère les temps sautés)
    const idx = clean.map((v) => Math.round((v - clean[0]) / med));
    for (let i = 0; i < m; i++) { sx += idx[i]; sy += clean[i]; sxx += idx[i] * idx[i]; sxy += idx[i] * clean[i]; }
    const slope = (m * sxy - sx * sy) / (m * sxx - sx * sx), icpt = (sy - slope * sx) / m;
    beatCfg.bpm = Math.round(600 / slope) / 10; beatCfg.deb = Math.max(0, Math.round(icpt * 100) / 100);
    $('#btBpm').value = beatCfg.bpm; $('#btDeb').value = beatCfg.deb;
    tapping = false; taps = []; $('#tap').classList.remove('rec'); $('#tap').textContent = 'Taper le tempo : lance l\'audio, tape chaque temps (1er tap = temps fort)';
    saveBeat(); drawBeat(true);
  }
  // validation : on arrête le tap dès que l'utilisateur met en pause, ou sur le bouton « Tempo » pendant la capture
  audio.addEventListener('pause', () => { if (tapping) finishTap(); });
  setInterval(() => { if (tapping && taps.length >= 6 && audio.currentTime - taps[taps.length - 1] > 2.5) finishTap(); }, 500);

  // --- piano + voix : deux pistes, deux volumes (Web Audio pour que ça marche aussi sur iPhone) ---
  let actx = null, gP = null, gV = null;
  function setupGraph() {
    if (actx || !(window.AudioContext || window.webkitAudioContext)) return;
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      const sP = actx.createMediaElementSource(audio);
      const sV = actx.createMediaElementSource(voice);
      gP = actx.createGain(); gV = actx.createGain();
      const lim = actx.createDynamicsCompressor();   // limiteur : évite la saturation si on pousse les deux curseurs
      lim.threshold.value = -3; lim.knee.value = 0; lim.ratio.value = 20; lim.attack.value = 0.003; lim.release.value = 0.15;
      sP.connect(gP).connect(lim); sV.connect(gV).connect(lim); lim.connect(actx.destination);
      applyVol();
    } catch { actx = gP = gV = null; }
  }
  function applyVol() {
    const p = $('#vp').value / 100, v = $('#vv').value / 100;
    $('#vpo').textContent = $('#vp').value + ' %'; $('#vvo').textContent = $('#vv').value + ' %';
    if (gP) { gP.gain.value = p; gV.gain.value = v; audio.volume = 1; voice.volume = 1; }
    else { audio.volume = Math.min(1, p); voice.volume = Math.min(1, v); }
  }
  function playBoth() {
    setupGraph();
    if (actx && actx.state === 'suspended') actx.resume();
    voice.currentTime = audio.currentTime;
    audio.play().catch(() => {});
    if (hasVoice()) voice.play().catch(() => {});
  }
  function toggle() { if (audio.paused) playBoth(); else { audio.pause(); voice.pause(); } }
  function seekTo(t) { audio.currentTime = t; if (hasVoice()) voice.currentTime = t; drawBeat(); }
  for (const [id, key] of [['#vp', 'vol-piano'], ['#vv', 'vol-voix']]) {
    $(id).value = store.get(key, $(id).value);
    $(id).addEventListener('input', () => { applyVol(); store.set(key, $(id).value); });
  }
  applyVol();
  $('#pp').innerHTML = PLAY;

  document.addEventListener('keydown', (e) => {
    if (e.target.matches('input, select')) return;
    if (e.code === 'Space' && cur >= 0) { e.preventDefault(); toggle(); }
    if (e.code === 'ArrowLeft') seekTo(Math.max(0, audio.currentTime - 5));
    if (e.code === 'ArrowRight') seekTo(Math.min(audio.duration || 0, audio.currentTime + 5));
  });

  if ('mediaSession' in navigator) {
    navigator.mediaSession.setActionHandler('play', () => playBoth());
    navigator.mediaSession.setActionHandler('pause', () => { audio.pause(); voice.pause(); });
    navigator.mediaSession.setActionHandler('previoustrack', () => step(-1));
    navigator.mediaSession.setActionHandler('nexttrack', () => step(1));
  }

  // --- téléchargement hors ligne ---
  $('#offline').addEventListener('click', async () => {
    const btn = $('#offline'); btn.disabled = true;
    try {
      const c = await caches.open(CACHE);
      const todo = tracks.filter((t) => !isCached(t));
      let done = tracks.length - todo.length;
      for (const t of todo) {
        btn.textContent = `Téléchargement… ${done}/${tracks.length}`;
        for (const f of files(t)) {
          if (cachedSet.has(f) || missing.has(f)) continue;
          try { await c.add(new Request(f)); cachedSet.add(f); }
          catch (err) { if (f === t.original) missing.add(f); else throw err; }
        }
        done++;
      }
    } catch {
      btn.textContent = 'Échec — réessayer'; btn.disabled = false; return;
    }
    render();
  });

  init();
})();
</script>
</body>
</html>
